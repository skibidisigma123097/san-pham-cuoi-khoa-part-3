<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
        integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="mainstyle.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <header class="topbar">
        <div class="d-flex align-items-center gap-2 p-2">
            <div class="icon"></div>
            <div class="brand">Gamehub fake</div>
        </div>

        <nav class="navbar navbar-expand-lg bg-light w-100">
            <div class="container-fluid">


                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navMenu">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0 nav-animated">

                        <li class="nav-item">
                            <a class="nav-link active" onclick="setActive(this); showHome()">Trang chủ</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" onclick="setActive(this); showRanking()">Bảng xếp hạng</a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" onclick="setActive(this); showAnalyticsPage()">Phân tích game</a>
                        </li>

                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle d-flex align-items-center" href="#" id="userDropdown"
                                role="button" data-bs-toggle="dropdown" aria-expanded="false">

                                <img src="https://ui-avatars.com/api/?name=User&background=0D8ABC&color=fff"
                                    id="userAvatar" class="rounded-circle me-2" width="32" height="32">

                                <span id="usernameDisplay">Tài khoản</span>
                            </a>
                            <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="userDropdown">
                                <li><a class="dropdown-item text-danger" href="#" id="logoutBtn"> ➜🚪 Đăng xuất</a></li>
                            </ul>
                        </li>

                    </ul>


                </div>
            </div>
        </nav>
    </header>
    <div class="search-box ms-3" style="position: relative; margin-bottom:20px; margin-top:10px;">
        <form class="d-flex" role="search" onsubmit="return false;">
            <input id="searchInput" class="form-control me-2" type="search" placeholder="Search game...">
            <button type="button" class="btn btn-outline-success">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </form>

        <div id="searchDropdown" class="search-dropdown"></div>
    </div>
    <div id="homeSection">
        <h1 class="text-center">Top Game Hiện Tại</h1>
        <div id="carousel" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner" id="carouselInner" data-bs-interval="3000">
            </div>

            <button class="carousel-control-prev" type="button" data-bs-target="#carousel" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>

            <button class="carousel-control-next" type="button" data-bs-target="#carousel" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>


        <h1 class="text-center">Một Vài Tựa Game Khác</h1>
        <div class="game-grid" id="gamecontainer">
        </div>
    </div>
    <div id="ranking-section" style="display:none">

        <h2 class="ranking-title">Top 10 Games Hot Nhất</h2>

        <table class="ranking-table">

            <thead>
                <tr>
                    <th></th>
                    <th>Game</th>
                    <th>Số người chơi hiện tại</th>
                </tr>
            </thead>

            <tbody id="ranking-body"></tbody>

        </table>

    </div>
    <div id="analyticsSection" style="display:none;">

        <h2 class="text-center mt-5">Phân Tích Game</h2>

        <div class="container-fluid mt-4">

            <div class="row mb-4 justify-content-center">

                <div class="col-md-4">
                    <select id="gameSelect1" class="form-select"></select>
                </div>

                <div class="col-md-4">
                    <select id="gameSelect2" class="form-select"></select>
                </div>

            </div>

            <ul class="nav nav-tabs justify-content-center mb-3">

                <li class="nav-item">
                    <button class="nav-link active" onclick="showChart('players')">
                        Người chơi
                    </button>
                </li>

                <li class="nav-item">
                    <button class="nav-link" onclick="showChart('price')">
                        Giá
                    </button>
                </li>

                <li class="nav-item">
                    <button class="nav-link" onclick="showChart('reviews')">
                        Tỉ lệ đánh giá
                    </button>
                </li>

            </ul>

            <div class="chart-box">

                <canvas id="playersChart"></canvas>
                <canvas id="priceChart" style="display:none"></canvas>
                <div id="reviewChart" style="display:none; gap:30px; justify-content:center;">

                    <div>
                        <h5 id="reviewTitle1"></h5>
                        <canvas id="reviewChart1"></canvas>
                    </div>

                    <div>
                        <h5 id="reviewTitle2"></h5>
                        <canvas id="reviewChart2"></canvas>
                    </div>

                </div>

            </div>

        </div>
    </div>
    <footer>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        (function () { if (!window.chatbase || window.chatbase("getState") !== "initialized") { window.chatbase = (...args) => { if (!window.chatbase.q) { window.chatbase.q = [] } window.chatbase.q.push(args) }; window.chatbase = new Proxy(window.chatbase, { get(target, prop) { if (prop === "q") { return target.q } return (...args) => target(prop, ...args) } }) } const onLoad = function () { const script = document.createElement("script"); script.src = "https://www.chatbase.co/embed.min.js"; script.id = "Gj0WH0OusajkdLL6d5taD"; script.domain = "www.chatbase.co"; document.body.appendChild(script) }; if (document.readyState === "complete") { onLoad() } else { window.addEventListener("load", onLoad) } })();
    </script>
</body>
<script type="module" src="kichbanmain.js"></script>
<script src="freefireconfig.js"></script>
</html>
