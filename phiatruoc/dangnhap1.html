<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA=="
    crossorigin="anonymous" referrerpolicy="no-referrer" />
  <link rel="stylesheet" href="dangnhapstyle.css">
</head>

<body>
  <header class="topbar">
    <div class="icon"></div>
    <div class="brand">Gamehub fake</div>
  </header>
  <div class="container">
    <h1 class="text-center" style="margin-top: 20px;">Đăng nhập</h1>
    <form id="loginForm" class="form-floating">
      <div class="form-floating mb-3">
        <input type="text" id="username" name="username" class="username form-control" placeholder="username" required>
        <label for="username">Vui lòng nhập username</label>
      </div>

      <div class="form-floating password-container">
        <input type="password" id="password" name="password" class="password form-control" placeholder="password"
          required autocomplete="off">
        <label for="password">Vui lòng nhập mật khẩu</label>

        <button type="button" id="show" class="toggle-password">
          <i class="fa-solid fa-eye"></i>
        </button>
      </div>

      <br>
      <input type="submit" class="button btn btn-primary" value="Đăng nhập">
    </form>
    <p class="small" style="margin-top: 25px;">Chưa có tài khoản? <a href="dangky.html">Đăng ký</a></p>
    <p class="small" style="margin-top: 5px;">Quên mật khẩu? <a href="resetmatkhau.html">Khôi phục tài khoản</a></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script src="kichbandangnhap.js"></script>

</body>

</html>
